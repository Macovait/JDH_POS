; JDH POS Supervisor Configuration
; Copy to /etc/supervisor/conf.d/jdh-workers.conf
; Then: sudo supervisorctl reread && sudo supervisorctl update

[program:jdh-queue-worker]
command=php /var/www/JDH_POS/scripts/worker.php --max-jobs=500 --sleep=1 --memory-limit=256
directory=/var/www/JDH_POS
autostart=true
autorestart=true
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
redirect_stderr=true
stdout_logfile=/var/log/jdh-queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
stopsignal=SIGTERM

[program:jdh-cron-runner]
command=bash -c "while true; do php /var/www/JDH_POS/scripts/cron-runner.php; sleep 60; done"
directory=/var/www/JDH_POS
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/jdh-cron-runner.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=10
stopsignal=SIGTERM

[program:jdh-etims-retry]
command=bash -c "while true; do php /var/www/JDH_POS/scripts/etims_retry_worker.php 50; sleep 60; done"
directory=/var/www/JDH_POS
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/jdh-etims-retry.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=10
stopsignal=SIGTERM

[group:jdh-pos]
programs=jdh-queue-worker,jdh-cron-runner,jdh-etims-retry
